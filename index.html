<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Boussole — HSI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0d0e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bezel-dark:#1c1e1f;
    --bezel-darker:#101112;
    --card-face:#2b2b2b;
    --card-face-2:#1f1f1f;
    --amber:#e8a33d;
    --amber-dim:#8a6222;
    --red:#c73e3e;
    --green:#4a9a6a;
    --white:#f2f0e8;
    --text-dim:#8a8f92;
    --text-bright:#f2f0e8;
    --mono: 'SF Mono', 'Roboto Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:#000;
    height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text-bright);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:max(20px, env(safe-area-inset-top)) 16px calc(max(24px, env(safe-area-inset-bottom)) + 40px);
    background:
      radial-gradient(ellipse at 50% -10%, #262a2c 0%, #0a0b0c 55%, #000 100%);
  }

  .header{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 4px 14px;
    border-bottom:1px solid #2a2c2d;
    margin-bottom:22px;
  }
  .header .title{font-size:13px;letter-spacing:0.14em;color:var(--text-dim);font-weight:600;}
  .header .status{font-size:11px;font-family:var(--mono);color:var(--text-dim);}
  .status.ok{color:var(--green);}
  .status.warn{color:var(--amber);}
  .status.err{color:var(--red);}

  .instrument-wrap{
    position:relative;
    width:min(88vw, 380px);
    aspect-ratio:1;
    border-radius:24px;
    background:
      radial-gradient(circle at 35% 25%, #2c2f31 0%, #17191a 55%, #0c0d0e 100%);
    box-shadow:
      0 0 0 1px #000,
      0 0 0 8px var(--bezel-darker),
      0 0 0 9px #303436,
      inset 0 2px 10px rgba(0,0,0,0.7),
      0 18px 40px rgba(0,0,0,0.6);
    padding:20px;
  }

  .card-face{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 30%, var(--card-face) 0%, var(--card-face-2) 100%);
    box-shadow:inset 0 0 0 1px #000, inset 0 2px 14px rgba(0,0,0,0.5);
  }
  .dial-mask{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
  }

  #dial{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    transform-origin:50% 50%;
    will-change:transform;
  }

  .lubber-line{
    position:absolute;
    top:2px; left:50%;
    width:3px; height:26px;
    background:var(--green);
    transform:translateX(-50%);
    z-index:5;
    box-shadow:0 0 4px rgba(74,154,106,0.5);
  }
  .lubber-line::after{
    content:"";
    position:absolute;
    top:24px; left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:8px solid var(--green);
  }

  .center-hub{
    position:absolute;top:50%;left:50%;
    width:16px;height:16px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #666 0%, #1a1a1a 100%);
    border-radius:50%;
    box-shadow:0 0 0 1px #000, 0 1px 3px rgba(0,0,0,0.6);
    z-index:6;
  }

  .knob{
    position:absolute;
    bottom:14px;
    right:14px;
    width:52px;height:52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #333 0%, #0f0f0f 100%);
    box-shadow:0 0 0 1px #000, 0 0 0 2px var(--white), inset 0 1px 2px rgba(255,255,255,0.08), 0 3px 6px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:7;
    touch-action:none;
    user-select:none;
    transform-origin:50% 50%;
  }
  .knob .hdg-label{
    font-size:9px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--amber);
    text-align:center;
    line-height:1.2;
  }

  .readout{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .readout .deg{
    font-family:var(--mono);
    font-size:52px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text-bright);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .readout .deg .unit{font-size:22px;color:var(--text-dim);margin-left:2px;}
  .readout .cardinal{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--amber);
    font-weight:600;
  }

  .data-grid{
    margin-top:14px;
    width:min(88vw, 380px);
    display:flex;
    flex-direction:column;
    gap:1px;
    background:#232526;
    border:1px solid #2a2c2d;
    border-radius:10px;
  }
  .data-cell{
    background:#141516;
    padding:12px 14px;
  }
  .data-cell:first-child{border-radius:9px 9px 0 0;}
  .data-cell:last-child{border-radius:0 0 9px 9px;}
  .data-cell .label{
    font-size:10.5px;
    line-height:1.6;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  .data-cell .value{
    font-family:var(--mono);
    font-size:15px;
    line-height:1.6;
    color:var(--text-bright);
    font-variant-numeric:tabular-nums;
  }
  .data-cell .value.small{font-size:12.5px;color:var(--text-dim);}

  .footnote{
    margin-top:16px;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    max-width:340px;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="header">
  <span class="title">BOUSSOLE — HSI NUMÉRIQUE</span>
  <span class="status" id="sensor-tag">CAPTEUR INACTIF</span>
</div>

<div class="instrument-wrap">
  <div class="card-face">
    <div class="dial-mask">
      <svg id="dial" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="#00000033" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="bug"></g>
        <polygon points="150,150 138,168 150,162 162,168" fill="#f2f0e8" opacity="0.9"/>
        <polygon points="150,150 138,132 150,138 162,132" fill="#f2f0e8" opacity="0.9"/>
      </svg>
      <svg id="dial-labels" viewBox="0 0 300 300" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">
        <g id="labels"></g>
      </svg>
    </div>
    <div class="lubber-line"></div>
    <div class="center-hub"></div>
    <div class="knob right" id="hdg-knob">
      <span class="hdg-label">HDG<br>SET</span>
    </div>
  </div>
</div>

<div class="readout">
  <div class="deg"><span id="deg-val">000</span><span class="unit">°</span></div>
  <div class="cardinal" id="cardinal-val">NORD</div>
</div>

<div class="data-grid">
  <div class="data-cell">
    <div class="label">VITESSE SOL</div>
    <div class="value" id="speed-val">—</div>
  </div>
  <div class="data-cell">
    <div class="label">POSITION (LAT / LONG)</div>
    <div class="value small" id="pos-val">—</div>
  </div>
</div>

<p class="footnote" id="footnote">
  Capteur activé automatiquement à l'ouverture. Tenez l'appareil à plat, loin de tout objet métallique, pour une lecture stable. Tournez le HDG SET pour sélectionner un cap.
</p>

<script>
(function(){
  const dial = document.getElementById('dial');
  const ticksG = document.getElementById('ticks');
  const labelsG = document.getElementById('labels');
  const bugG = document.getElementById('bug');
  const degVal = document.getElementById('deg-val');
  const cardinalVal = document.getElementById('cardinal-val');
  const posVal = document.getElementById('pos-val');
  const speedVal = document.getElementById('speed-val');
  const sensorTag = document.getElementById('sensor-tag');
  const footnote = document.getElementById('footnote');
  const hdgKnob = document.getElementById('hdg-knob');

  const cx = 150, cy = 150;

  function labelForTick(deg){
    if(deg === 0) return 'N';
    if(deg === 90) return 'E';
    if(deg === 180) return 'S';
    if(deg === 270) return 'O';
    return String(Math.round(deg/10));
  }

  for(let deg=0; deg<360; deg+=2){
    const rad = (deg-90) * Math.PI/180;
    const isMajor = deg % 30 === 0;
    const isMid = deg % 10 === 0;
    const rOuter = 138;
    const rInner = isMajor ? 110 : (isMid ? 121 : 130);
    const x1 = cx + rOuter*Math.cos(rad), y1 = cy + rOuter*Math.sin(rad);
    const x2 = cx + rInner*Math.cos(rad), y2 = cy + rInner*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke', isMajor ? '#f2f0e8' : '#8a8f92');
    line.setAttribute('stroke-width', isMajor ? '2.6' : (isMid ? '1.6' : '0.9'));
    ticksG.appendChild(line);
  }

  // Les chiffres sont crees une seule fois mais repositionnes a chaque cap :
  // ils tournent AUTOUR du centre comme le cadran, mais restent toujours a l'horizontale
  // (contrairement aux graduations, qui elles pivotent avec la carte).
  const labelDefs = [];
  for(let deg=0; deg<360; deg+=30){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family',"'SF Mono','Roboto Mono',monospace");
    const isCardinal = deg % 90 === 0;
    t.setAttribute('font-size', isCardinal ? '24' : '14');
    t.setAttribute('font-weight', '700');
    t.setAttribute('fill', isCardinal ? '#e8a33d' : '#f2f0e8');
    t.textContent = labelForTick(deg);
    labelsG.appendChild(t);
    labelDefs.push({ baseDeg: deg, el: t, isCardinal: isCardinal });
  }

  function positionLabels(display){
    const r = 95;
    labelDefs.forEach(function(item){
      const screenDeg = item.baseDeg - display;
      const rad = (screenDeg - 90) * Math.PI/180;
      const x = cx + r*Math.cos(rad), y = cy + r*Math.sin(rad);
      item.el.setAttribute('x', x);
      item.el.setAttribute('y', y + 7);
    });
  }

  const dirNames = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  function dirFor(h){ return dirNames[Math.round(h/22.5)%16]; }

  let currentHeadingMag = 0;
  let sensorActive = false;
  let bugHeading = 0;

  function renderBug(){
    bugG.innerHTML = '';
    const rad = (bugHeading-90) * Math.PI/180;
    const r = 132;
    const x = cx + r*Math.cos(rad), y = cy + r*Math.sin(rad);
    const innerAngle = rad + Math.PI/2;
    const p1x = x + 12*Math.cos(rad), p1y = y + 12*Math.sin(rad);
    const p2x = x - 9*Math.cos(rad) + 8*Math.cos(innerAngle), p2y = y - 9*Math.sin(rad) + 8*Math.sin(innerAngle);
    const p3x = x - 9*Math.cos(rad) - 8*Math.cos(innerAngle), p3y = y - 9*Math.sin(rad) - 8*Math.sin(innerAngle);
    const tri = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    tri.setAttribute('points', p1x+','+p1y+' '+p2x+','+p2y+' '+p3x+','+p3y);
    tri.setAttribute('fill', '#e8a33d');
    tri.setAttribute('stroke', '#0c0d0e');
    tri.setAttribute('stroke-width', '1');
    bugG.appendChild(tri);
  }

  function render(){
    const display = currentHeadingMag;
    dial.style.transform = 'rotate(' + (-display) + 'deg)';
    positionLabels(display);
    degVal.textContent = String(Math.round(display)).padStart(3,'0');
    cardinalVal.textContent = dirFor(display);
  }

  function setBug(h){
    bugHeading = ((h % 360) + 360) % 360;
    renderBug();
  }

  // Molette HDG SET tactile : on la tourne du doigt autour de son centre,
  // le repère de cap (bug) suit exactement la rotation. Un simple tap (sans
  // glisser) recale le repère sur le cap actuel, comme avant.
  let knobAngle = 0;
  let dragging = false;
  let dragMoved = false;
  let lastPointerAngle = 0;

  function angleFromCenter(clientX, clientY){
    const rect = hdgKnob.getBoundingClientRect();
    const ccx = rect.left + rect.width/2, ccy = rect.top + rect.height/2;
    return Math.atan2(clientY - ccy, clientX - ccx) * 180/Math.PI;
  }

  hdgKnob.addEventListener('pointerdown', function(e){
    dragging = true;
    dragMoved = false;
    lastPointerAngle = angleFromCenter(e.clientX, e.clientY);
    hdgKnob.setPointerCapture(e.pointerId);
  });

  // Sensibilité de rotation : 0.45° de repère par degré tourné du doigt.
  // En dessous de 1:1 pour permettre un réglage plus fin et précis.
  const KNOB_SENSITIVITY = 0.45;

  hdgKnob.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const a = angleFromCenter(e.clientX, e.clientY);
    let delta = a - lastPointerAngle;
    while(delta > 180) delta -= 360;
    while(delta < -180) delta += 360;
    if(Math.abs(delta) > 0.5){
      dragMoved = true;
      knobAngle += delta;
      hdgKnob.style.transform = 'rotate(' + knobAngle + 'deg)';
      setBug(bugHeading + delta * KNOB_SENSITIVITY);
      lastPointerAngle = a;
    }
  });

  function endDrag(){
    if(dragging && !dragMoved){
      setBug(currentHeadingMag);
    }
    dragging = false;
  }
  hdgKnob.addEventListener('pointerup', endDrag);
  hdgKnob.addEventListener('pointercancel', function(){ dragging = false; });

  // Lissage circulaire : chaque nouvelle lecture ne fait avancer le cap affiché
  // que d'une fraction de l'ecart, ce qui absorbe le bruit/tremblement du capteur
  // sans rendre la lecture molle sur un vrai changement de cap.
  let headingInitialized = false;
  const SMOOTHING = 0.25;

  function pushHeading(raw){
    raw = ((raw % 360) + 360) % 360;
    if(!headingInitialized){
      currentHeadingMag = raw;
      headingInitialized = true;
    } else {
      let diff = raw - currentHeadingMag;
      while(diff > 180) diff -= 360;
      while(diff < -180) diff += 360;
      currentHeadingMag = ((currentHeadingMag + diff*SMOOTHING) % 360 + 360) % 360;
    }
    render();
  }

  function handleOrientation(e){
    let heading;
    if(typeof e.webkitCompassHeading === 'number'){
      // iOS : lecture directe de la boussole materielle, toujours fiable
      heading = e.webkitCompassHeading;
    } else if(e.absolute === true && e.alpha !== null){
      // Android : n'accepter que les evenements "absolus" (repere Terre fixe).
      // Les evenements non-absolus derivent progressivement et sont la cause
      // la plus frequente de sauts brusques sur un mouvement pourtant leger.
      heading = 360 - e.alpha;
    } else {
      return;
    }
    pushHeading(heading);
  }

  // Vitesse lissee (moyenne mobile) + rejet des lectures peu fiables : une position
  // GPS ponctuelle imprecise peut faire croire a un deplacement alors que le
  // telephone est immobile. On ignore les correctifs de mauvaise precision et on
  // ramene le bruit residuel a 0 sous un seuil.
  let smoothedSpeedKmh = null;
  const SPEED_SMOOTHING = 0.3;
  const SPEED_NOISE_FLOOR_KMH = 3;
  const GPS_ACCURACY_MAX_M = 25;

  function pushSpeed(rawKmh){
    const clamped = rawKmh < SPEED_NOISE_FLOOR_KMH ? 0 : rawKmh;
    if(smoothedSpeedKmh === null){
      smoothedSpeedKmh = clamped;
    } else {
      smoothedSpeedKmh = smoothedSpeedKmh + (clamped - smoothedSpeedKmh) * SPEED_SMOOTHING;
    }
    speedVal.textContent = Math.round(smoothedSpeedKmh) + ' km/h';
  }

  function requestLocation(){
    if(!('geolocation' in navigator)){
      posVal.textContent = 'indisponible';
      speedVal.textContent = 'indisponible';
      return;
    }
    navigator.geolocation.watchPosition(function(pos){
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      posVal.textContent = lat.toFixed(4) + '° / ' + lon.toFixed(4) + '°';

      // Position peu precise (mauvais signal) : on ignore cette lecture pour la
      // vitesse plutot que d'afficher un pic errone, mais on garde la derniere
      // valeur fiable affichee.
      if(typeof pos.coords.accuracy === 'number' && pos.coords.accuracy > GPS_ACCURACY_MAX_M){
        return;
      }

      if(typeof pos.coords.speed === 'number' && pos.coords.speed !== null){
        pushSpeed(pos.coords.speed * 3.6);
      } else {
        speedVal.textContent = 'indisponible';
      }
    }, function(){
      posVal.textContent = 'refusé';
      speedVal.textContent = 'refusé';
    }, { enableHighAccuracy:true, maximumAge:2000, timeout:8000 });
  }

  function goLive(){
    sensorActive = true;
    sensorTag.textContent = 'CAPTEUR ACTIF';
    sensorTag.classList.add('ok');
    footnote.textContent = 'Lecture en temps réel. Éloignez le téléphone des aimants et objets métalliques pour une précision optimale.';
    requestLocation();
  }

  function autoStart(){
    if(sensorActive) return;

    // Android : deviceorientationabsolute est le flux fiable (cap vrai/vrai-relatif au monde).
    // deviceorientation seul sert de repli si absolute n'est pas exposé.
    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      goLive();
    } else if('ondeviceorientation' in window){
      window.addEventListener('deviceorientation', handleOrientation, true);
      goLive();
    } else {
      sensorTag.textContent = 'AUCUN CAPTEUR';
      sensorTag.classList.add('err');
      footnote.textContent = "Aucun capteur d'orientation détecté sur cet appareil.";
    }
  }

  setBug(0);
  render();
  autoStart();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
