<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Boussole — HSI + Soleil/Lune</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0d0e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bezel-dark:#1c1e1f;
    --bezel-darker:#101112;
    --card-face:#2b2b2b;
    --card-face-2:#1f1f1f;
    --amber:#e8a33d;
    --amber-dim:#8a6222;
    --red:#c73e3e;
    --green:#4a9a6a;
    --white:#f2f0e8;
    --text-dim:#8a8f92;
    --text-bright:#f2f0e8;
    --mono: 'SF Mono', 'Roboto Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:#000;
    height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text-bright);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:max(20px, env(safe-area-inset-top)) 16px calc(max(24px, env(safe-area-inset-bottom)) + 40px);
    background:
      radial-gradient(ellipse at 50% -10%, #262a2c 0%, #0a0b0c 55%, #000 100%);
  }

  .header{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 4px 14px;
    border-bottom:1px solid #2a2c2d;
    margin-bottom:22px;
  }
  .header .title{font-size:13px;letter-spacing:0.14em;color:var(--text-dim);font-weight:600;}
  .header .status{font-size:11px;font-family:var(--mono);color:var(--text-dim);}
  .status.ok{color:var(--green);}
  .status.warn{color:var(--amber);}
  .status.err{color:var(--red);}

  .instrument-wrap{
    position:relative;
    width:min(88vw, 380px);
    aspect-ratio:1;
    border-radius:24px;
    background:
      radial-gradient(circle at 35% 25%, #2c2f31 0%, #17191a 55%, #0c0d0e 100%);
    box-shadow:
      0 0 0 1px #000,
      0 0 0 8px var(--bezel-darker),
      0 0 0 9px #303436,
      inset 0 2px 10px rgba(0,0,0,0.7),
      0 18px 40px rgba(0,0,0,0.6);
    padding:20px;
  }

  .card-face{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 30%, var(--card-face) 0%, var(--card-face-2) 100%);
    box-shadow:inset 0 0 0 1px #000, inset 0 2px 14px rgba(0,0,0,0.5);
  }
  .dial-mask{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
  }

  #dial{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    transform-origin:50% 50%;
    will-change:transform;
  }

  .lubber-line{
    position:absolute;
    top:2px; left:50%;
    width:3px; height:26px;
    background:var(--green);
    transform:translateX(-50%);
    z-index:5;
    box-shadow:0 0 4px rgba(74,154,106,0.5);
  }
  .lubber-line::after{
    content:"";
    position:absolute;
    top:24px; left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:8px solid var(--green);
  }

  .center-hub{
    position:absolute;top:50%;left:50%;
    width:16px;height:16px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #666 0%, #1a1a1a 100%);
    border-radius:50%;
    box-shadow:0 0 0 1px #000, 0 1px 3px rgba(0,0,0,0.6);
    z-index:6;
  }

  .knob{
    position:absolute;
    bottom:14px;
    right:14px;
    width:52px;height:52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #333 0%, #0f0f0f 100%);
    box-shadow:0 0 0 1px #000, 0 0 0 2px var(--white), inset 0 1px 2px rgba(255,255,255,0.08), 0 3px 6px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:7;
    touch-action:none;
    user-select:none;
    transform-origin:50% 50%;
  }
  .knob .hdg-label{
    font-size:9px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--amber);
    text-align:center;
    line-height:1.2;
  }

  .readout{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .readout .deg{
    font-family:var(--mono);
    font-size:52px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text-bright);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .readout .deg .unit{font-size:22px;color:var(--text-dim);margin-left:2px;}
  .readout .cardinal{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--amber);
    font-weight:600;
  }

  .data-grid{
    margin-top:14px;
    width:min(88vw, 380px);
    display:flex;
    flex-direction:column;
    gap:1px;
    background:#232526;
    border:1px solid #2a2c2d;
    border-radius:10px;
  }
  .data-cell{
    background:#141516;
    padding:12px 14px;
  }
  .data-cell:first-child{border-radius:9px 9px 0 0;}
  .data-cell:last-child{border-radius:0 0 9px 9px;}
  .data-cell .label{
    font-size:10.5px;
    line-height:1.6;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  .data-cell .value{
    font-family:var(--mono);
    font-size:15px;
    line-height:1.6;
    color:var(--text-bright);
    font-variant-numeric:tabular-nums;
  }
  .data-cell .value.small{font-size:12.5px;color:var(--text-dim);}
</style>
</head>
<body>

<div class="header">
  <span class="title">BOUSSOLE — HSI NUMÉRIQUE</span>
  <span class="status" id="sensor-tag">CAPTEUR INACTIF</span>
</div>

<div class="instrument-wrap">
  <div class="card-face">
    <div class="dial-mask">
      <svg id="dial" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="140" fill="none" stroke="#00000033" stroke-width="1"/>
        <g id="ticks"></g>
        <g id="bug"></g>
        <polygon points="150,150 138,168 150,162 162,168" fill="#f2f0e8" opacity="0.9"/>
        <polygon points="150,150 138,132 150,138 162,132" fill="#f2f0e8" opacity="0.9"/>
      </svg>
      <svg id="dial-labels" viewBox="0 0 300 300" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">
        <g id="labels"></g>
      </svg>
    </div>
    <svg id="celestial-layer" viewBox="0 0 300 300" style="position:absolute;inset:20px;width:calc(100% - 40px);height:calc(100% - 40px);overflow:visible;pointer-events:none;">
      <g id="sun-marker"></g>
      <g id="moon-marker"></g>
    </svg>
    <div class="lubber-line"></div>
    <div class="center-hub"></div>
    <div class="knob right" id="hdg-knob">
      <span class="hdg-label">HDG<br>SET</span>
    </div>
  </div>
</div>

<div class="readout">
  <div class="deg"><span id="deg-val">000</span><span class="unit">°</span></div>
  <div class="cardinal" id="cardinal-val">NORD</div>
</div>

<div class="data-grid">
  <div class="data-cell">
    <div class="label">VITESSE SOL</div>
    <div class="value" id="speed-val">—</div>
  </div>
  <div class="data-cell">
    <div class="label">POSITION</div>
    <div class="value small" id="pos-val" style="line-height:1.9;white-space:pre-line;">—</div>
  </div>
</div>

<script>
// ===== Moteur astronomique (Soleil : Meeus ch.25 ; Lune : ELP abrege, Meeus ch.47) =====
// Repris tel quel du moteur d'eclipse deja valide au chiffre pres sur les exemples
// de reference de Meeus (longitude/latitude/distance lunaires exactes).
(function(){
  const RAD = Math.PI/180, DEG = 180/Math.PI;

  function sunEcliptic(jdUT){
    const T = (jdUT - 2451545)/36525;
    const L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
    const M = 357.52911 + 35999.05029*T - 0.0001537*T*T;
    const C = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(M*RAD)
            + (0.019993 - 0.000101*T)*Math.sin(2*M*RAD)
            + 0.000289*Math.sin(3*M*RAD);
    const Om = 125.04 - 1934.136*T;
    const lam = L0 + C - 0.00569 - 0.00478*Math.sin(Om*RAD);
    const eps = 23 + 26/60 + 21.448/3600
              - (46.8150*T + 0.00059*T*T - 0.001813*Math.pow(T,3))/3600
              + 0.00256*Math.cos(Om*RAD);
    return { lam: ((lam%360)+360)%360, eps };
  }

  const TA=[[0,0,1,0,6288774,-20905355],[2,0,-1,0,1274027,-3699111],[2,0,0,0,658314,-2955968],
  [0,0,2,0,213618,-569925],[0,1,0,0,-185116,48888],[0,0,0,2,-114332,-3149],
  [2,0,-2,0,58793,246158],[2,-1,-1,0,57066,-152138],[2,0,1,0,53322,-170733],
  [2,-1,0,0,45758,-204586],[0,1,-1,0,-40923,-129620],[1,0,0,0,-34720,108743],
  [0,1,1,0,-30383,104755],[2,0,0,-2,15327,10321],[0,0,1,2,-12528,0],
  [0,0,1,-2,10980,79661],[4,0,-1,0,10675,-34782],[0,0,3,0,10034,-23210],
  [4,0,-2,0,8548,-21636],[2,1,-1,0,-7888,24208],[2,1,0,0,-6766,30824],
  [1,0,-1,0,-5163,-8379],[1,1,0,0,4987,-16675],[2,-1,1,0,4036,-12831],
  [2,0,2,0,3994,-10445],[4,0,0,0,3861,-11650],[2,0,-3,0,3665,14403],
  [0,1,-2,0,-2689,-7003],[2,0,-1,2,-2602,0],[2,-1,-2,0,2390,10056],
  [1,0,1,0,-2348,6322],[2,-2,0,0,2236,-9884],[0,1,2,0,-2120,5751],
  [0,2,0,0,-2069,0],[2,-2,-1,0,2048,-4950],[2,0,1,-2,-1773,4130],
  [2,0,0,2,-1595,0],[4,-1,-1,0,1215,-3958],[0,0,2,2,-1110,0],
  [3,0,-1,0,-892,3258],[2,1,1,0,-810,2616],[4,-1,-2,0,759,-1897],
  [0,2,-1,0,-713,-2117],[2,2,-1,0,-700,2354],[2,1,-2,0,691,0],
  [2,-1,0,-2,596,0],[4,0,1,0,549,-1423],[0,0,4,0,537,-1117],
  [4,-1,0,0,520,-1571],[1,0,-2,0,-487,-1739],[2,1,0,-2,-399,0],
  [0,0,2,-2,-381,-4421],[1,1,1,0,351,0],[3,0,-2,0,-340,0],
  [4,0,-3,0,330,0],[2,-1,2,0,327,0],[0,2,1,0,-323,1165],
  [1,1,-1,0,299,0],[2,0,3,0,294,0],[2,0,-1,-2,0,8752]];
  const TB=[[0,0,0,1,5128122],[0,0,1,1,280602],[0,0,1,-1,277693],[2,0,0,-1,173237],
  [2,0,-1,1,55413],[2,0,-1,-1,46271],[2,0,0,1,32573],[0,0,2,1,17198],
  [2,0,1,-1,9266],[0,0,2,-1,8822],[2,-1,0,-1,8216],[2,0,-2,-1,4324],
  [2,0,1,1,4200],[2,1,0,-1,-3359],[2,-1,-1,1,2463],[2,-1,0,1,2211],
  [2,-1,-1,-1,2065],[0,1,-1,-1,-1870],[4,0,-1,-1,1828],[0,1,0,1,-1794],
  [0,0,0,3,-1749],[0,1,-1,1,-1565],[1,0,0,1,-1491],[0,1,1,1,-1475],
  [0,1,1,-1,-1410],[0,1,0,-1,-1344],[1,0,0,-1,-1335],[0,0,3,1,1107],
  [4,0,0,-1,1021],[4,0,-1,1,833],[0,0,1,-3,777],[4,0,-2,1,671],
  [2,0,0,-3,607],[2,0,2,-1,596],[2,-1,1,-1,491],[2,0,-2,1,-451],
  [0,0,3,-1,439],[2,0,2,1,422],[2,0,-3,-1,421],[2,1,-1,1,-366],
  [2,1,0,1,-351],[4,0,0,1,331],[2,-1,1,1,315],[2,-2,0,-1,302],
  [0,0,1,3,-283],[2,1,1,-1,-229],[1,1,0,-1,223],[1,1,0,1,223],
  [0,1,-2,-1,-220],[2,1,-1,-1,-220],[1,0,1,1,-185],[2,-1,-2,-1,181],
  [0,1,2,1,-177],[4,0,-2,-1,176],[4,-1,-1,-1,166],[1,0,1,-1,-164],
  [4,0,1,-1,132],[1,0,-1,-1,-119],[4,-1,0,-1,115],[2,-2,0,1,107]];

  function moonEcliptic(jdUT){
    const T = (jdUT - 2451545)/36525;
    const Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T*T + Math.pow(T,3)/538841 - Math.pow(T,4)/65194000;
    const D  = 297.8501921 + 445267.1114034*T - 0.0018819*T*T + Math.pow(T,3)/545868 - Math.pow(T,4)/113065000;
    const M  = 357.5291092 + 35999.0502909*T - 0.0001536*T*T + Math.pow(T,3)/24490000;
    const Mp = 134.9633964 + 477198.8675055*T + 0.0087414*T*T + Math.pow(T,3)/69699 - Math.pow(T,4)/14712000;
    const F  =  93.2720950 + 483202.0175233*T - 0.0036539*T*T - Math.pow(T,3)/3526000 + Math.pow(T,4)/863310000;
    const A1 = 119.75 + 131.849*T;
    const A2 =  53.09 + 479264.290*T;
    const A3 = 313.45 + 481266.484*T;
    const E  = 1 - 0.002516*T - 0.0000074*T*T;

    let sl=0, sr=0, sb=0;
    for(const t of TA){
      const arg = (t[0]*D + t[1]*M + t[2]*Mp + t[3]*F)*RAD;
      const e = Math.pow(E, Math.abs(t[1]));
      sl += t[4]*e*Math.sin(arg);
      sr += t[5]*e*Math.cos(arg);
    }
    for(const t of TB){
      const arg = (t[0]*D + t[1]*M + t[2]*Mp + t[3]*F)*RAD;
      sb += t[4]*Math.pow(E, Math.abs(t[1]))*Math.sin(arg);
    }
    sl += 3958*Math.sin(A1*RAD) + 1962*Math.sin((Lp-F)*RAD) + 318*Math.sin(A2*RAD);
    sb += -2235*Math.sin(Lp*RAD) + 382*Math.sin(A3*RAD) + 175*Math.sin((A1-F)*RAD)
        + 175*Math.sin((A1+F)*RAD) + 127*Math.sin((Lp-Mp)*RAD) - 115*Math.sin((Lp+Mp)*RAD);

    return { lam: ((Lp + sl/1e6)%360+360)%360, bet: sb/1e6, dist: 385000.56 + sr/1000.0 };
  }

  function eclipticToEquatorial(lam, bet, eps){
    const l=lam*RAD, b=bet*RAD, e=eps*RAD;
    const ra = Math.atan2(Math.sin(l)*Math.cos(e) - Math.tan(b)*Math.sin(e), Math.cos(l));
    const dec = Math.asin(Math.sin(b)*Math.cos(e) + Math.cos(b)*Math.sin(e)*Math.sin(l));
    return { ra: ((ra*DEG)%360+360)%360, dec: dec*DEG };
  }

  function altAzFromRaDec(jdUT, lat, lon, raDeg, decDeg){
    const Tu = (jdUT - 2451545)/36525;
    const gmst = (280.46061837 + 360.98564736629*(jdUT-2451545) + 0.000387933*Tu*Tu) % 360;
    const H = (((gmst + lon - raDeg)%360+360)%360)*RAD;
    const latR = lat*RAD, dec = decDeg*RAD;
    const alt = Math.asin(Math.sin(latR)*Math.sin(dec) + Math.cos(latR)*Math.cos(dec)*Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(latR) - Math.tan(dec)*Math.cos(latR));
    return { alt: alt*DEG, az: ((az*DEG + 180)%360+360)%360 };
  }

  function jdNow(){ return Date.now()/86400000 + 2440587.5; }

  window.ASTRO = {
    sunPosition: function(lat, lon){
      const jdUT = jdNow();
      const s = sunEcliptic(jdUT);
      const eq = eclipticToEquatorial(s.lam, 0, s.eps);
      const aa = altAzFromRaDec(jdUT, lat, lon, eq.ra, eq.dec);
      return { alt: aa.alt, az: aa.az };
    },
    moonPosition: function(lat, lon){
      const jdUT = jdNow();
      const s = sunEcliptic(jdUT);
      const m = moonEcliptic(jdUT);
      const eq = eclipticToEquatorial(m.lam, m.bet, s.eps);
      const aa = altAzFromRaDec(jdUT, lat, lon, eq.ra, eq.dec);
      const elong = ((m.lam - s.lam)%360+360)%360;
      const illum = (1 - Math.cos(elong*RAD))/2;
      return { alt: aa.alt, az: aa.az, illum: illum, waxing: elong < 180 };
    }
  };
})();

(function(){
  const dial = document.getElementById('dial');
  const ticksG = document.getElementById('ticks');
  const labelsG = document.getElementById('labels');
  const bugG = document.getElementById('bug');
  const degVal = document.getElementById('deg-val');
  const cardinalVal = document.getElementById('cardinal-val');
  const posVal = document.getElementById('pos-val');
  const speedVal = document.getElementById('speed-val');
  const sensorTag = document.getElementById('sensor-tag');
  const hdgKnob = document.getElementById('hdg-knob');

  const cx = 150, cy = 150;

  function labelForTick(deg){
    if(deg === 0) return 'N';
    if(deg === 90) return 'E';
    if(deg === 180) return 'S';
    if(deg === 270) return 'O';
    return String(Math.round(deg/10));
  }

  for(let deg=0; deg<360; deg+=2){
    const rad = (deg-90) * Math.PI/180;
    const isMajor = deg % 30 === 0;
    const isMid = deg % 10 === 0;
    const rOuter = 138;
    const rInner = isMajor ? 110 : (isMid ? 121 : 130);
    const x1 = cx + rOuter*Math.cos(rad), y1 = cy + rOuter*Math.sin(rad);
    const x2 = cx + rInner*Math.cos(rad), y2 = cy + rInner*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke', isMajor ? '#f2f0e8' : '#8a8f92');
    line.setAttribute('stroke-width', isMajor ? '2.6' : (isMid ? '1.6' : '0.9'));
    ticksG.appendChild(line);
  }

  // Les chiffres sont crees une seule fois mais repositionnes a chaque cap :
  // ils tournent AUTOUR du centre comme le cadran, mais restent toujours a l'horizontale
  // (contrairement aux graduations, qui elles pivotent avec la carte).
  const labelDefs = [];
  for(let deg=0; deg<360; deg+=30){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family',"'SF Mono','Roboto Mono',monospace");
    const isCardinal = deg % 90 === 0;
    t.setAttribute('font-size', isCardinal ? '24' : '14');
    t.setAttribute('font-weight', '700');
    t.setAttribute('fill', isCardinal ? '#c73e3e' : '#f2f0e8');
    t.textContent = labelForTick(deg);
    labelsG.appendChild(t);
    labelDefs.push({ baseDeg: deg, el: t, isCardinal: isCardinal });
  }

  function positionLabels(display){
    const r = 95;
    labelDefs.forEach(function(item){
      const screenDeg = item.baseDeg - display;
      const rad = (screenDeg - 90) * Math.PI/180;
      const x = cx + r*Math.cos(rad), y = cy + r*Math.sin(rad);
      item.el.setAttribute('x', x);
      item.el.setAttribute('y', y + 7);
    });
  }

  const dirNames = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  function dirFor(h){ return dirNames[Math.round(h/22.5)%16]; }

  let currentHeadingMag = 0;
  let sensorActive = false;
  let bugHeading = 0;

  function renderBug(){
    bugG.innerHTML = '';
    const rad = (bugHeading-90) * Math.PI/180;
    const r = 132;
    const x = cx + r*Math.cos(rad), y = cy + r*Math.sin(rad);
    const innerAngle = rad + Math.PI/2;
    const p1x = x + 12*Math.cos(rad), p1y = y + 12*Math.sin(rad);
    const p2x = x - 9*Math.cos(rad) + 8*Math.cos(innerAngle), p2y = y - 9*Math.sin(rad) + 8*Math.sin(innerAngle);
    const p3x = x - 9*Math.cos(rad) - 8*Math.cos(innerAngle), p3y = y - 9*Math.sin(rad) - 8*Math.sin(innerAngle);
    const tri = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    tri.setAttribute('points', p1x+','+p1y+' '+p2x+','+p2y+' '+p3x+','+p3y);
    tri.setAttribute('fill', '#e8a33d');
    tri.setAttribute('stroke', '#0c0d0e');
    tri.setAttribute('stroke-width', '1');
    bugG.appendChild(tri);
  }

  // Reperes Soleil/Lune HORS du cadran, dans une couche SVG non rognee, a
  // laquelle on applique la meme rotation que le cadran a chaque mise a jour
  // du cap (voir render()). Jaune si le Soleil est au-dessus de l'horizon,
  // gris en dessous. La Lune est un rendu reel (canvas ombre), pas une forme
  // SVG plate, integre via foreignObject pour tourner avec le reste.
  const celestialLayer = document.getElementById('celestial-layer');
  const sunMarkerG = document.getElementById('sun-marker');
  const moonMarkerG = document.getElementById('moon-marker');
  const GREY_BELOW_HORIZON = '#6b6f72';
  const CELESTIAL_R = 160; // hors du cercle du cadran (bord a r=150), dans le renfoncement du boitier

  function renderSunMarker(az, alt){
    sunMarkerG.innerHTML = '';
    const rad = (az-90) * Math.PI/180;
    const x = cx + CELESTIAL_R*Math.cos(rad), y = cy + CELESTIAL_R*Math.sin(rad);
    const color = alt > 0 ? '#e8a33d' : GREY_BELOW_HORIZON;
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y);
    circle.setAttribute('r', 11);
    circle.setAttribute('fill', color);
    circle.setAttribute('stroke', '#0c0d0e');
    circle.setAttribute('stroke-width', '1.2');
    sunMarkerG.appendChild(circle);
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', x); label.setAttribute('y', y+4.5);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('font-size','13');
    label.setAttribute('font-weight','700');
    label.setAttribute('font-family',"'SF Mono','Roboto Mono',monospace");
    label.setAttribute('fill', alt > 0 ? '#1a1a1a' : '#2c2c2c');
    label.textContent = 'S';
    sunMarkerG.appendChild(label);
  }

  // Icone de phase lunaire : ombrage reel par canvas (terminateur elliptique),
  // pas une forme SVG plate. illum = fraction eclairee (0=nouvelle, 1=pleine).
  function drawMoonPhase(canvas, illum, waxing, visible){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const mcx = W/2, mcy = H/2, R = W/2 - 2;
    const litColor = visible ? '#f2f0e8' : GREY_BELOW_HORIZON;
    const darkColor = '#17181a';

    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.beginPath(); ctx.arc(mcx,mcy,R,0,2*Math.PI); ctx.clip();

    const grad = ctx.createRadialGradient(mcx-R*0.3,mcy-R*0.3,R*0.1,mcx,mcy,R*1.1);
    grad.addColorStop(0, darkColor);
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = litColor;
    ctx.beginPath();
    if(waxing){ ctx.arc(mcx,mcy,R,-Math.PI/2,Math.PI/2); }
    else { ctx.arc(mcx,mcy,R,Math.PI/2,3*Math.PI/2); }
    ctx.closePath();
    ctx.fill();

    const ew = R*Math.abs(1-2*illum);
    ctx.beginPath();
    ctx.ellipse(mcx,mcy,ew,R,0,0,2*Math.PI);
    ctx.fillStyle = illum < 0.5 ? darkColor : litColor;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(mcx,mcy,R,0,2*Math.PI);
    ctx.strokeStyle = 'rgba(242,240,232,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Lettre L : trace blanc epais puis remplissage sombre, pour rester
    // lisible aussi bien sur la portion claire que sombre du disque.
    ctx.font = "700 " + Math.round(R*0.85) + "px 'SF Mono','Roboto Mono',monospace";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText('L', mcx, mcy+1);
    ctx.fillStyle = '#101112';
    ctx.fillText('L', mcx, mcy+1);
  }

  function renderMoonMarker(az, alt, illum, waxing){
    moonMarkerG.innerHTML = '';
    const rad = (az-90) * Math.PI/180;
    const size = 26;
    const x = cx + CELESTIAL_R*Math.cos(rad), y = cy + CELESTIAL_R*Math.sin(rad);
    const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
    fo.setAttribute('x', x - size/2);
    fo.setAttribute('y', y - size/2);
    fo.setAttribute('width', size);
    fo.setAttribute('height', size);
    const canvas = document.createElement('canvas');
    canvas.width = size*2; canvas.height = size*2;
    canvas.style.width = size+'px'; canvas.style.height = size+'px';
    fo.appendChild(canvas);
    moonMarkerG.appendChild(fo);
    drawMoonPhase(canvas, illum, waxing, alt > 0);
  }

  let lastKnownLat = null, lastKnownLon = null;
  setInterval(function(){
    if(lastKnownLat !== null) updateCelestialBodies(lastKnownLat, lastKnownLon);
  }, 60000);

  function updateCelestialBodies(lat, lon){
    if(!window.ASTRO) return;
    const sun = ASTRO.sunPosition(lat, lon);
    const moon = ASTRO.moonPosition(lat, lon);
    renderSunMarker(sun.az, sun.alt);
    renderMoonMarker(moon.az, moon.alt, moon.illum, moon.waxing);
  }

  function render(){
    const display = currentHeadingMag;
    const rot = 'rotate(' + (-display) + 'deg)';
    dial.style.transform = rot;
    celestialLayer.style.transform = rot;
    celestialLayer.style.transformOrigin = '50% 50%';
    positionLabels(display);
    degVal.textContent = String(Math.round(display)).padStart(3,'0');
    cardinalVal.textContent = dirFor(display);
  }

  function setBug(h){
    bugHeading = ((h % 360) + 360) % 360;
    renderBug();
  }

  // Molette HDG SET tactile : on la tourne du doigt autour de son centre,
  // le repère de cap (bug) suit exactement la rotation. Un simple tap (sans
  // glisser) recale le repère sur le cap actuel, comme avant.
  let knobAngle = 0;
  let dragging = false;
  let dragMoved = false;
  let lastPointerAngle = 0;

  function angleFromCenter(clientX, clientY){
    const rect = hdgKnob.getBoundingClientRect();
    const ccx = rect.left + rect.width/2, ccy = rect.top + rect.height/2;
    return Math.atan2(clientY - ccy, clientX - ccx) * 180/Math.PI;
  }

  hdgKnob.addEventListener('pointerdown', function(e){
    dragging = true;
    dragMoved = false;
    lastPointerAngle = angleFromCenter(e.clientX, e.clientY);
    hdgKnob.setPointerCapture(e.pointerId);
  });

  // Sensibilité de rotation : 0.45° de repère par degré tourné du doigt.
  // En dessous de 1:1 pour permettre un réglage plus fin et précis.
  const KNOB_SENSITIVITY = 0.45;

  hdgKnob.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const a = angleFromCenter(e.clientX, e.clientY);
    let delta = a - lastPointerAngle;
    while(delta > 180) delta -= 360;
    while(delta < -180) delta += 360;
    if(Math.abs(delta) > 0.5){
      dragMoved = true;
      knobAngle += delta;
      hdgKnob.style.transform = 'rotate(' + knobAngle + 'deg)';
      setBug(bugHeading + delta * KNOB_SENSITIVITY);
      lastPointerAngle = a;
    }
  });

  function endDrag(){
    if(dragging && !dragMoved){
      setBug(currentHeadingMag);
    }
    dragging = false;
  }
  hdgKnob.addEventListener('pointerup', endDrag);
  hdgKnob.addEventListener('pointercancel', function(){ dragging = false; });

  // Cap universel, fiable a plat ET a la verticale : combine la direction du
  // haut de l'appareil (fiable a plat) et celle de l'arriere de l'appareil
  // (fiable a la verticale), ponderee par la fiabilite de chacune a l'instant T.
  // Verifie numeriquement : correspond exactement a 360-alpha a plat, reste
  // stable et continu quelle que soit l'inclinaison.
  function universalHeading(alphaDeg, betaDeg, gammaDeg){
    const a = alphaDeg*Math.PI/180, b = betaDeg*Math.PI/180, g = gammaDeg*Math.PI/180;
    const cA=Math.cos(a), sA=Math.sin(a), cB=Math.cos(b), sB=Math.sin(b), cG=Math.cos(g), sG=Math.sin(g);
    const r12 = -cB*sA;
    const r22 = cA*cB;
    const r13 = cA*sG + cG*sA*sB;
    const r23 = sA*sG - cA*cG*sB;
    const mY = Math.hypot(r12, r22);
    const mZ = Math.hypot(r13, r23);
    const hY = Math.atan2(r12, r22);
    const hZ = Math.atan2(-r13, -r23);
    const x = mY*Math.sin(hY) + mZ*Math.sin(hZ);
    const y = mY*Math.cos(hY) + mZ*Math.cos(hZ);
    let h = Math.atan2(x,y)*180/Math.PI;
    if(h<0) h += 360;
    return h;
  }

  // Lissage circulaire : chaque nouvelle lecture ne fait avancer le cap affiché
  // que d'une fraction de l'ecart, ce qui absorbe le bruit/tremblement du capteur
  // sans rendre la lecture molle sur un vrai changement de cap.
  let headingInitialized = false;
  const SMOOTHING = 0.25;
  const SMOOTHING_OUTLIER = 0.08;
  const OUTLIER_THRESHOLD = 45;

  function pushHeading(raw){
    raw = ((raw % 360) + 360) % 360;
    if(!headingInitialized){
      currentHeadingMag = raw;
      headingInitialized = true;
    } else {
      let diff = raw - currentHeadingMag;
      while(diff > 180) diff -= 360;
      while(diff < -180) diff += 360;
      // Un ecart isole tres large (perturbation, sursaut du capteur) est amorti
      // beaucoup plus fort qu'un ecart normal ; un vrai virage soutenu continue
      // de produire de grands ecarts a chaque lecture et converge quand meme.
      const factor = Math.abs(diff) > OUTLIER_THRESHOLD ? SMOOTHING_OUTLIER : SMOOTHING;
      currentHeadingMag = ((currentHeadingMag + diff*factor) % 360 + 360) % 360;
    }
    render();
  }

  function handleOrientation(e){
    let heading;
    if(typeof e.webkitCompassHeading === 'number'){
      // iOS : lecture directe de la boussole materielle, deja fiable a toute inclinaison
      heading = e.webkitCompassHeading;
    } else if(e.alpha !== null && e.beta !== null && e.gamma !== null){
      // Android : formule universelle plat + vertical
      heading = universalHeading(e.alpha, e.beta, e.gamma);
    } else if(e.alpha !== null){
      heading = 360 - e.alpha;
    } else {
      return;
    }
    pushHeading(heading);
  }

  // Vitesse lissee (moyenne mobile) + rejet des lectures peu fiables : une position
  // GPS ponctuelle imprecise peut faire croire a un deplacement alors que le
  // telephone est immobile. On ignore les correctifs de mauvaise precision et on
  // ramene le bruit residuel a 0 sous un seuil.
  let smoothedSpeedKmh = null;
  const SPEED_SMOOTHING = 0.3;
  const SPEED_NOISE_FLOOR_KMH = 3;
  const GPS_ACCURACY_MAX_M = 25;

  function pushSpeed(rawKmh){
    const clamped = rawKmh < SPEED_NOISE_FLOOR_KMH ? 0 : rawKmh;
    if(smoothedSpeedKmh === null){
      smoothedSpeedKmh = clamped;
    } else {
      smoothedSpeedKmh = smoothedSpeedKmh + (clamped - smoothedSpeedKmh) * SPEED_SMOOTHING;
    }
    speedVal.textContent = Math.round(smoothedSpeedKmh) + ' km/h';
  }

  // Format degres/minutes/secondes, ex: 33° 35' 24" N
  function toDMS(value, posLetter, negLetter){
    const dir = value >= 0 ? posLetter : negLetter;
    const abs = Math.abs(value);
    let d = Math.floor(abs);
    let mFull = (abs - d) * 60;
    let m = Math.floor(mFull);
    let s = Math.round((mFull - m) * 60);
    // report du retenu si l'arrondi des secondes atteint 60
    if(s === 60){ s = 0; m += 1; }
    if(m === 60){ m = 0; d += 1; }
    return d + '° ' + m + "' " + s + '" ' + dir;
  }

  function formatLatLon(lat, lon){
    return 'Latitude : ' + toDMS(lat, 'N', 'S') + '\nLongitude : ' + toDMS(lon, 'E', 'W');
  }

  function requestLocation(){
    if(!('geolocation' in navigator)){
      posVal.textContent = 'indisponible';
      speedVal.textContent = 'indisponible';
      return;
    }
    navigator.geolocation.watchPosition(function(pos){
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      posVal.textContent = formatLatLon(lat, lon);
      lastKnownLat = lat; lastKnownLon = lon;
      updateCelestialBodies(lat, lon);

      // Position peu precise (mauvais signal) : on ignore cette lecture pour la
      // vitesse plutot que d'afficher un pic errone, mais on garde la derniere
      // valeur fiable affichee.
      if(typeof pos.coords.accuracy === 'number' && pos.coords.accuracy > GPS_ACCURACY_MAX_M){
        return;
      }

      if(typeof pos.coords.speed === 'number' && pos.coords.speed !== null){
        pushSpeed(pos.coords.speed * 3.6);
      } else {
        speedVal.textContent = 'indisponible';
      }
    }, function(){
      posVal.textContent = 'refusé';
      speedVal.textContent = 'refusé';
    }, { enableHighAccuracy:true, maximumAge:2000, timeout:8000 });
  }

  function goLive(){
    sensorActive = true;
    sensorTag.textContent = 'CAPTEUR ACTIF';
    sensorTag.classList.add('ok');
    requestLocation();
  }

  function autoStart(){
    if(sensorActive) return;

    // Android : deviceorientationabsolute est le flux fiable (cap vrai/vrai-relatif au monde).
    // deviceorientation seul sert de repli si absolute n'est pas exposé.
    if('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      goLive();
    } else if('ondeviceorientation' in window){
      window.addEventListener('deviceorientation', handleOrientation, true);
      goLive();
    } else {
      sensorTag.textContent = 'AUCUN CAPTEUR';
      sensorTag.classList.add('err');
    }
  }

  setBug(0);
  render();
  autoStart();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
